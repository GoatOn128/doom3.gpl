name: build-ubuntu

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# a new commit cancels the superseded run for the same branch
concurrency:
  group: build-ubuntu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.config }}
    runs-on: ${{ matrix.os }}
    env:
      # the content based ccache hashing must not depend on absolute paths
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: 'true'
    strategy:
      # one failing leg cancels the remaining legs of this OS, the other
      # OS workflow keeps running for redundancy
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        # the linux sys code is 32-bit only ( BUILD_STRING and the inline
        # asm assume x86 ), so the CI builds a 32-bit binary with multilib
        arch: [x86]
        config: [debug, release]
    steps:
      - uses: actions/checkout@v4
      - name: clean stale log
        shell: bash
        run: rm -f build.log
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: ccache cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          # the exact key misses on every new commit on purpose: the
          # restore-keys prefix hands the previous cache over so each run
          # starts from the newest state and saves its own
          key: ccache-ubuntu-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: |
            ccache-ubuntu-${{ matrix.arch }}-
      - name: sdl3 cache
        uses: actions/cache@v4
        with:
          path: sdl3
          # the SDL3 install prefix only changes when the SDL3 version of
          # the unified platform changes, so one key per version is enough
          key: sdl3-ubuntu-${{ matrix.arch }}-3.4.18
      - name: install linux deps
        shell: bash
        run: |
          set -o pipefail
          sudo dpkg --add-architecture i386 || true
          sudo apt-get update -qq 2>&1 | tee -a build.log
          sudo apt-get install -y -qq gcc-multilib g++-multilib 2>&1 | tee -a build.log
          sudo apt-get install -y -qq ninja-build m4 ccache 2>&1 | tee -a build.log
          # the renderer dlopens libGL, so only X11, ALSA and zlib are
          # needed at link time, all in 32-bit for the -m32 build, plus the
          # GL, OpenAL and OpenSSL dev files the engine and curl include
          sudo apt-get install -y -qq libx11-dev:i386 libxext-dev:i386 libxxf86vm-dev:i386 libasound2-dev:i386 zlib1g-dev:i386 libgl-dev:i386 libglx-dev:i386 libopenal-dev:i386 libssl-dev:i386 2>&1 | tee -a build.log
      - name: build sdl3
        shell: bash
        run: |
          set -o pipefail
          if [ -f sdl3/lib/libSDL3.a ]; then
            echo "SDL3 restored from cache" | tee -a build.log
            exit 0
          fi
          # ubuntu ships no 32-bit SDL3 package, the unified platform needs
          # the same 3.4.18 release that is vendored under third-party
          curl -fsSL https://github.com/libsdl-org/SDL/releases/download/release-3.4.18/SDL3-3.4.18.tar.gz -o SDL3-3.4.18.tar.gz 2>&1 | tee -a build.log
          tar xzf SDL3-3.4.18.tar.gz
          # -m32 keeps the library at the same pointer size as the engine,
          # -w keeps the third-party warnings out of the build digest, the
          # subsystems the engine does not use stay out of the library
          cmake -S SDL3-3.4.18 -B sdl3-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-m32 -w" -DCMAKE_CXX_FLAGS="-m32 -w" \
            -DCMAKE_EXE_LINKER_FLAGS=-m32 \
            -DCMAKE_INSTALL_PREFIX="$PWD/sdl3" \
            -DSDL_SHARED=OFF -DSDL_STATIC=ON -DSDL_TEST=OFF \
            -DSDL_AUDIO=OFF -DSDL_RENDER=OFF -DSDL_CAMERA=OFF -DSDL_GPU=OFF \
            2>&1 | tee -a build.log
          cmake --build sdl3-build --parallel 4 2>&1 | tee -a build.log
          cmake --install sdl3-build 2>&1 | tee -a build.log
      - name: configure
        shell: bash
        run: |
          set -o pipefail
          case "${{ matrix.config }}" in
            debug)   config="Debug" ;;
            release) config="Release" ;;
          esac
          # -m32 keeps CMake's pointer-size probe at 4 so the products get
          # the x86 names the engine loads at runtime. The compiler
          # launchers route every compile through ccache so a redundant
          # checkout does not rebuild the untouched objects. The SDL3
          # prefix carries the unified platform library
          cmake -S neo -B build -G Ninja -DCMAKE_BUILD_TYPE="$config" \
            -DCMAKE_C_FLAGS=-m32 -DCMAKE_CXX_FLAGS=-m32 \
            -DCMAKE_EXE_LINKER_FLAGS=-m32 -DCMAKE_SHARED_LINKER_FLAGS=-m32 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_PREFIX_PATH="$PWD/sdl3" \
            2>&1 | tee -a build.log
      - name: build
        shell: bash
        run: |
          set -o pipefail
          # -k 0 keeps going so the digest lists every failing file in one run
          cmake --build build --parallel 4 -- -k 0 2>&1 | tee -a build.log
      - name: ccache stats
        if: always()
        shell: bash
        run: ccache -s >> build.log 2>&1 || true
      - name: digest
        if: always()
        shell: bash
        env:
          LEG: ${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.config }}
          STATUS: ${{ job.status }}
        run: |
          cp build.log "log-$LEG.log" 2>/dev/null || true
          python .github/scripts/digest.py || true
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.config }}
          path: |
            log-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.config }}.log
            digest-fragment-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.config }}.md
            status-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.config }}
          if-no-files-found: ignore
